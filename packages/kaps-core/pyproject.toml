[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaps-core"
version = "0.0.0"
description = "Kalshi client: signing, REST, WebSocket, fixed-point money and fees"
license = "MIT"
license-files = ["../../LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "httpx>=0.28",
    "pydantic>=2.11",
    "websockets>=15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kaps_core"]

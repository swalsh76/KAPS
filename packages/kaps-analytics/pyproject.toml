[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaps-analytics"
version = "0.0.0"
description = "Features, models, recommendations and the trading service (runs on the analytics node)"
license = "MIT"
license-files = ["../../LICENSE"]
requires-python = ">=3.12"
dependencies = ["kaps-core", "pyarrow>=21", "tzdata; sys_platform == 'win32'"]

[tool.hatch.build.targets.wheel]
packages = ["src/kaps_analytics"]

[tool.uv.sources]
kaps-core = { workspace = true }

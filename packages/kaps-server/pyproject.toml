[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaps-server"
version = "0.0.0"
description = "Ingest, database, API and web front end (runs on the database host)"
license = "MIT"
license-files = ["../../LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "kaps-core",
    "pydantic>=2.11",
    "sqlalchemy[asyncio]>=2.0.40",
    "alembic>=1.15",
    "asyncpg>=0.30",
]

[project.scripts]
kaps-admin = "kaps_server.admin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaps_server"]

[tool.uv.sources]
kaps-core = { workspace = true }

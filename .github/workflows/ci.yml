name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        run: pipx install uv==0.13.4

      - name: Sync
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy packages

      - name: Test and coverage gate
        run: uv run pytest --cov --cov-report=term

      - name: Coverage gate for money and fee code
        run: >
          uv run coverage report --fail-under=95
          --include="*/kaps_core/fixedpoint.py,*/kaps_core/fees.py"
